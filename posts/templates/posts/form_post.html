{% extends 'base.html' %}

{% block title %}Novo Post{% endblock %}

{% block content %}
<h2>Cadastrar Novo Post</h2>


<form method="POST" enctype="multipart/form-data" class="card p-3">
  {% csrf_token %}

  {% for field in form %}
  <div class="mb-3">
    <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
    {{ field }}

    {% if field.errors %}
    <div class="text-danger">
      {% for error in field.errors %}
      <small>{{ error }}</small>
      {% endfor %}
    </div>
    {% endif %}
  </div>
  {% endfor %}

  <!-- Botão -->
  <span><button type="submit" class="btn btn-success">Salvar</button>  </span>
</form>

{% endblock %}
